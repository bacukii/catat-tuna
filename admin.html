<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Admin - Catat Tuna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.min.js"></script>
    <style>
        body { background-color: #f3f4f6; }
        .hidden-panel { display: none !important; }
    </style>
</head>
<body class="text-gray-800 antialiased flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <i class="fas fa-server text-xl text-blue-400"></i>
            <h1 class="text-lg font-bold tracking-wide">Data Center Tuna</h1>
        </div>
        <a href="index.html" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-2 transition">
            <i class="fas fa-arrow-left"></i> Kembali
        </a>
    </header>

    <!-- LAYAR 1: LOGIN TOKEN -->
    <div id="loginScreen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm text-center border border-gray-100">
            <i class="fas fa-lock text-4xl text-gray-300 mb-4"></i>
            <h2 class="text-xl font-bold text-gray-800 mb-2">Akses Terkunci</h2>
            <p class="text-xs text-gray-500 mb-5">Masukkan Token Admin untuk melihat database.</p>
            <input type="password" id="tokenInput" placeholder="••••••••" class="w-full text-center text-2xl tracking-[0.5em] font-mono border-2 border-gray-200 rounded-lg p-3 mb-4 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
            <button onclick="checkToken()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition active:scale-95">
                Buka Akses
            </button>
            <p id="loginError" class="text-red-500 text-xs font-bold mt-3 hidden">Token salah!</p>
        </div>
    </div>

    <!-- LAYAR 2: DASHBOARD ADMIN -->
    <main id="adminScreen" class="hidden-panel flex-1 overflow-y-auto p-4 flex flex-col gap-4">
        
        <div class="bg-blue-100 border border-blue-200 p-3 rounded-lg flex justify-between items-center text-blue-800">
            <span class="text-sm font-semibold"><i class="fas fa-wifi mr-2"></i>Status: Terhubung ke Supabase</span>
            <button onclick="loadSesiBongkar()" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold shadow hover:bg-blue-700"><i class="fas fa-sync-alt mr-1"></i> Refresh</button>
        </div>

        <h3 class="font-bold text-gray-700 text-sm mt-2 border-b-2 border-gray-300 pb-2">Riwayat Sesi Bongkar</h3>
        <div id="sesiList" class="flex flex-col gap-3 pb-10">
            <!-- Data Sesi akan dirender di sini -->
            <div class="text-center py-10 text-gray-400 text-sm"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data dari cloud...</div>
        </div>

    </main>

    <!-- Modal Detail Timbangan -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 z-50 hidden-panel flex-col">
        <div class="bg-white flex-1 mt-10 rounded-t-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-gray-100 p-4 border-b flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-gray-800" id="detailKapal">KM. NAMA KAPAL</h3>
                    <p class="text-xs text-gray-500" id="detailTanggal">Tanggal</p>
                </div>
                <button onclick="closeDetail()" class="bg-red-100 text-red-600 hover:bg-red-200 w-8 h-8 rounded-full flex items-center justify-center font-bold transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Summary Bar -->
            <div class="flex bg-blue-600 text-white p-3 text-xs justify-around font-bold">
                <span>Total: <span id="sumEkor" class="text-blue-200">0</span> Ekor</span>
                <span>Berat: <span id="sumBerat" class="text-blue-200">0</span> KG</span>
            </div>

            <div class="flex-1 overflow-y-auto bg-gray-50 p-3">
                <table class="w-full text-left border-collapse bg-white rounded-lg shadow-sm overflow-hidden">
                    <thead class="bg-gray-800 text-white text-[10px] uppercase tracking-wider">
                        <tr>
                            <th class="p-3 w-10 text-center">No</th>
                            <th class="p-3">Info / Pemilik</th>
                            <th class="p-3 text-right">Berat (KG)</th>
                        </tr>
                    </thead>
                    <tbody id="detailTableBody" class="text-sm divide-y divide-gray-100">
                        <!-- Rincian akan dirender di sini -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI TOKEN ---
        // Ganti dengan kombinasi rahasia milikmu atau bos-mu
        const ADMIN_TOKEN = "BOS2026"; 

        // --- Inisialisasi Supabase ---
        const supabaseUrl = 'https://stydpkjwnuyjbccmgciq.supabase.co';
        const supabaseKey = 'sb_publishable_YdFXJ6Rsi_NFHz61HsM2Ow_pqz6R5XT';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const loginScreen = document.getElementById('loginScreen');
        const adminScreen = document.getElementById('adminScreen');
        const tokenInput = document.getElementById('tokenInput');
        const errorMsg = document.getElementById('loginError');

        // Fitur submit token dengan tombol Enter
        tokenInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkToken();
        });

        function checkToken() {
            if (tokenInput.value === ADMIN_TOKEN) {
                loginScreen.classList.add('hidden-panel');
                adminScreen.classList.remove('hidden-panel');
                loadSesiBongkar();
            } else {
                errorMsg.classList.remove('hidden');
                tokenInput.value = '';
                setTimeout(() => errorMsg.classList.add('hidden'), 3000);
            }
        }

        const formatNum = (num) => Number(num).toFixed(2);
        const escapeHTML = (str) => !str ? '' : str.toString().replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));

        async function loadSesiBongkar() {
            const listContainer = document.getElementById('sesiList');
            listContainer.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm"><i class="fas fa-spinner fa-spin mr-2"></i>Mengambil data...</div>';

            try {
                // Mengambil data sesi diurutkan dari yang terbaru
                const { data, error } = await supabase
                    .from('sesi_bongkar')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data.length === 0) {
                    listContainer.innerHTML = '<div class="bg-white p-5 rounded-lg text-center text-gray-500 text-sm border shadow-sm">Belum ada data sesi bongkar di Cloud.</div>';
                    return;
                }

                listContainer.innerHTML = data.map(sesi => `
                    <div onclick="openDetail('${sesi.id}', '${escapeHTML(sesi.nama_kapal)}', '${sesi.tanggal}')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer hover:border-blue-300 transition active:scale-[0.98]">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                                <i class="fas fa-ship"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm">${escapeHTML(sesi.nama_kapal)}</h4>
                                <p class="text-xs text-gray-500 font-medium">${sesi.tanggal} • <span class="text-[10px] text-gray-400">${new Date(sesi.created_at).toLocaleTimeString('id-ID')}</span></p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-gray-300"></i>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                listContainer.innerHTML = '<div class="bg-red-50 p-4 rounded-lg text-red-500 text-sm text-center border border-red-200">Gagal memuat data. Periksa koneksi internet.</div>';
            }
        }

        async function openDetail(sesiId, namaKapal, tanggal) {
            const modal = document.getElementById('detailModal');
            const tbody = document.getElementById('detailTableBody');
            
            document.getElementById('detailKapal').innerText = namaKapal;
            document.getElementById('detailTanggal').innerText = tanggal;
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-10 text-gray-400 text-xs"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat rincian...</td></tr>';
            
            modal.classList.remove('hidden-panel');
            modal.classList.add('flex');

            try {
                // Mengambil rincian timbangan berdasarkan sesi_id
                const { data, error } = await supabase
                    .from('detail_timbangan')
                    .select('*')
                    .eq('sesi_id', sesiId)
                    .order('no_urut', { ascending: true });

                if (error) throw error;

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center py-10 text-gray-400 text-xs">Tidak ada rincian ikan.</td></tr>';
                    document.getElementById('sumEkor').innerText = '0';
                    document.getElementById('sumBerat').innerText = '0.00';
                    return;
                }

                let totalBerat = 0;
                
                tbody.innerHTML = data.map(r => {
                    totalBerat += r.berat_kg;
                    let infoHtml = '';
                    
                    if (r.mode === 'kapal') {
                        infoHtml = `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold">KAPAL</span> <span class="text-gray-400 ml-1">${r.jam}</span>`;
                    } else {
                        infoHtml = `
                            <span class="font-bold text-gray-800">${escapeHTML(r.pemilik)}</span>
                            <div class="text-[10px] text-gray-500 mt-0.5"><span class="text-amber-600 font-bold">${escapeHTML(r.jenis_ikan)}</span> • ${r.jam}</div>
                        `;
                    }

                    return `
                    <tr>
                        <td class="p-3 text-center font-bold text-gray-400 text-xs border-r">${r.no_urut}</td>
                        <td class="p-3 text-xs">${infoHtml}</td>
                        <td class="p-3 font-mono font-bold text-sm text-gray-800 text-right">${formatNum(r.berat_kg)}</td>
                    </tr>
                    `;
                }).join('');

                document.getElementById('sumEkor').innerText = data.length;
                document.getElementById('sumBerat').innerText = formatNum(totalBerat);

            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-10 text-red-400 text-xs">Gagal memuat rincian data.</td></tr>';
            }
        }

        function closeDetail() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden-panel');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
